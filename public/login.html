<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ISMS Login</title>

    <link
        rel="stylesheet"
        href="/css/main.css"
    >
</head>

<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-brand">
                <div class="login-logo">
                    ISMS
                </div>

                <div>
                    <h1>
                        Integrated Security Management System
                    </h1>

                    <p>
                        Security Asset Maintenance
                    </p>
                </div>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>

                <p>
                    Sign in to continue to the dashboard.
                </p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    id="loginButton"
                    class="login-button"
                    type="submit"
                >
                    Sign In
                </button>
            </form>

            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>

            <footer class="login-footer">
                <span>ISMS Version 1.0.0</span>
            </footer>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
