<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ISMS Users</title>

    <link
        rel="stylesheet"
        href="/css/main.css"
    >
</head>

<body>
    <!-- Shared sidebar generated by layout.js -->
    <aside
        id="sidebar"
        class="sidebar"
    ></aside>

    <!-- Shared top navigation generated by layout.js -->
    <header
        id="topbar"
        class="topbar"
    ></header>

    <main class="main-content">
        <section class="page-heading">
            <div>
                <h1>User Management</h1>

                <p>
                    Create, view, update and delete ISMS users.
                </p>
            </div>

            <button
                id="showUserFormButton"
                class="primary-button"
                type="button"
            >
                Add User
            </button>
        </section>

        <!-- User form panel -->
        <section
            id="userFormPanel"
            class="content-panel hidden"
        >
            <div class="panel-header">
                <div>
                    <h2 id="userFormTitle">
                        Add User
                    </h2>

                    <p>
                        Enter the user information below.
                    </p>
                </div>
            </div>

            <form id="userForm">
                <!-- Empty value means create mode -->
                <input
                    id="userId"
                    type="hidden"
                >

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            id="fullName"
                            name="fullName"
                            type="text"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">
                            Phone Number
                        </label>

                        <input
                            id="phoneNumber"
                            name="phoneNumber"
                            type="text"
                            maxlength="30"
                        >
                    </div>

                    <div class="form-group">
                        <label for="roleId">
                            Role ID
                        </label>

                        <input
                            id="roleId"
                            name="roleId"
                            type="number"
                            min="1"
                            required
                        >
                    </div>

                    <div
                        id="passwordGroup"
                        class="form-group form-grid-full"
                    >
                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                        >

                        <small class="field-help">
                            Required when creating a user.
                            Leave blank while editing to keep the
                            existing password.
                        </small>
                    </div>
                </div>

                <div class="form-actions">
                    <button
                        id="saveUserButton"
                        class="primary-button"
                        type="submit"
                    >
                        Save User
                    </button>

                    <button
                        id="cancelUserButton"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>
                </div>
            </form>

            <p
                id="formMessage"
                class="page-message"
                aria-live="polite"
            ></p>
        </section>

        <!-- Users table -->
        <section class="content-panel">
            <div class="panel-header table-panel-header">
                <div>
                    <h2>Users</h2>

                    <p>
                        Existing ISMS user accounts.
                    </p>
                </div>

                <div class="table-tools">
                    <input
                        id="userSearch"
                        class="search-input"
                        type="search"
                        placeholder="Search users..."
                    >

                    <button
                        id="refreshUsersButton"
                        class="secondary-button"
                        type="button"
                    >
                        Refresh
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role ID</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="7">
                                Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p
                id="usersMessage"
                class="page-message"
                aria-live="polite"
            ></p>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/users.js"></script>
</body>
</html>
